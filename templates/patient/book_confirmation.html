{% extends "base.html" %}
{% load static tailwind_tags %}
{% block content %}
{% include 'includes/patient_breadcrumb.html' %}
<section class="mx-auto max-w-xl px-4 py-16 text-center sm:px-6">
  <span class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-teal-100 text-teal-600 dark:bg-teal-900/50 dark:text-teal-400">
    <i class="fa-solid fa-calendar-check text-2xl"></i>
  </span>
  <h1 class="mt-6 text-2xl font-semibold">Booking request sent</h1>
  <p class="mt-3 text-stone-600 dark:text-stone-400">
    Dr. {{ doctor.user.get_full_name }} will be notified and will confirm your appointment shortly.
  </p>
  <a href="{% url 'patient:dashboard' %}"
    class="mt-6 inline-flex h-11 items-center justify-center rounded-full bg-teal-600 px-6 text-sm font-semibold text-white shadow-sm transition hover:bg-teal-700">
    Back to dashboard
  </a>
</section>
{% endblock %}
